# CI (W155, docs/CI.md tier model): Tier A gate + Tier B evidence.
# Full suite and live probes are NOT here — they are tier C (release gate,
# deferred per operator decision 2026-09-26) and stay out of PR CI by the
# resource directive (AGENTS.md). Linux-only: the repo's containment is
# Bubblewrap; no cross-OS jobs are promised.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (lint, typecheck, build, toolbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mcp-toolbox/package.json # the toolbox pins pnpm@11.5.2; corepack's default shim (12.x) is refused by pnpm itself
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run toolbox:verify

  evidence:
    name: evidence (curated test set)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mcp-toolbox/package.json
      # The containment suites (W130, W132 x3, hub /bash, W144) drive the real
      # Linux Bubblewrap backend and correctly fail closed without it
      # ("containment backend unavailable" — the 2026-09-26 live CI finding).
      # ubuntu-latest ships no bwrap; Ubuntu 24.04 also restricts unprivileged
      # user namespaces by default, which bwrap needs. W130's credential
      # custody test additionally drives the real secret-service store
      # (secret-tool over D-Bus), so the job provisions a headless keyring.
      - name: Install system prerequisites (bubblewrap, D-Bus secret service)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gnome-keyring dbus-x11 libsecret-1-0
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Unlock a headless keyring for the W130 credential-custody e2e: the
      # control plane stores material through secret-tool (D-Bus Secret
      # Service), which needs a session bus, a running keyring daemon WITH
      # the secrets component, and an unlocked default collection. The
      # daemon's env output is captured synchronously — --daemonize detaches
      # stdout, so the fifth live run exported an EMPTY GNOME_KEYRING_CONTROL
      # and secret-tool found no service.
      - name: Unlock the headless secret-service keyring
        run: |
          set +e
          eval "$(dbus-launch --sh-syntax)"
          # The daemon refuses to create its control socket if the parent
          # directory is missing (the seventh live run: "couldn't access
          # control socket: /run/user/1001/keyring/control: No such file or
          # directory" — daemon up, secrets component never served).
          mkdir -p /run/user/$(id -u)/keyring
          # Foreground --start: prints the daemon env (incl. the control
          # socket) and keeps the daemon alive under the session bus. Every
          # probe below is failure-tolerant: a missing piece is diagnosed by
          # the W130 machine-gate (fail closed), not by a broken setup step.
          daemon_env="$(gnome-keyring-daemon --start --components=secrets 2>&1)"
          echo "keyring daemon env: $daemon_env"
          echo "$daemon_env" | tr ';' '\n' | grep 'GNOME_KEYRING_CONTROL=' | sed 's/^  //' >> "$GITHUB_ENV" || true
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          # Unlock the default collection (empty password for a fresh
          # login.keyring created by --start above).
          echo "" | gnome-keyring-daemon --unlock 2>&1 | tee /tmp/kr-unlock.log | grep -o 'GNOME_KEYRING_CONTROL=[^;]*' | head -1 >> "$GITHUB_ENV" || true
          cat /tmp/kr-unlock.log || true
          grep -E "KEYRING|DBUS" "$GITHUB_ENV" || echo "warning: no keyring env captured; W130 will fail closed on its machine-gate"
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci