# CI (W155, docs/CI.md tier model): Tier A gate + Tier B evidence.
# Full suite and live probes are NOT here — they are tier C (release gate,
# deferred per operator decision 2026-09-26) and stay out of PR CI by the
# resource directive (AGENTS.md). Linux-only: the repo's containment is
# Bubblewrap; no cross-OS jobs are promised.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (lint, typecheck, build, toolbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mcp-toolbox/package.json # the toolbox pins pnpm@11.5.2; corepack's default shim (12.x) is refused by pnpm itself
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run toolbox:verify

  evidence:
    name: evidence (curated test set)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mcp-toolbox/package.json
      # The containment suites (W130, W132 x3, hub /bash, W144) drive the real
      # Linux Bubblewrap backend and correctly fail closed without it
      # ("containment backend unavailable" — the 2026-09-26 live CI finding).
      # ubuntu-latest ships no bwrap; Ubuntu 24.04 also restricts unprivileged
      # user namespaces by default, which bwrap needs. W130's credential
      # custody test additionally drives the real secret-service store
      # (secret-tool over D-Bus), so the job provisions a headless keyring.
      - name: Install system prerequisites (bubblewrap, D-Bus secret service)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gnome-keyring dbus-x11 libsecret-1-0 libsecret-tools python3-secretstorage
          command -v secret-tool # fail the step here if the CLI is missing (the eighth run's ENOENT)
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Unlock a headless keyring for the W130 credential-custody e2e: the
      # control plane stores material through secret-tool (D-Bus Secret
      # Service), which needs a session bus, a running keyring daemon WITH
      # the secrets component, and an existing, unlocked default collection.
      # Live-run findings baked into this step: the control socket needs its
      # parent dir (run 7); --daemonize detaches stdout so the control var
      # must be captured from a foreground --start (run 5); and a fresh
      # daemon creates NO default collection — secret-tool answers "Object
      # does not exist at path /org/freedesktop/secrets/collection/login"
      # (run 9) — so the collection is created by seeding the keyring file
      # directory first and letting the daemon's first-store path materialize
      # the rest, verified by a probe round trip before W130 runs.
      - name: Unlock the headless secret-service keyring
        run: |
          set +e
          eval "$(dbus-launch --sh-syntax)"
          mkdir -p /run/user/$(id -u)/keyring
          mkdir -p "$HOME/.local/share/keyrings"
          daemon_env="$(gnome-keyring-daemon --start --components=secrets,pkcs11 2>&1)"
          echo "keyring daemon env: $daemon_env"
          echo "$daemon_env" | tr ';' '\n' | grep 'GNOME_KEYRING_CONTROL=' | sed 's/^  //' >> "$GITHUB_ENV" || true
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          printf '%s\n' \
            'import os, subprocess, sys, time' \
            'bus = subprocess.check_output(["bash", "-c", "echo $DBUS_SESSION_BUS_ADDRESS"]).decode().strip()' \
            'os.environ["DBUS_SESSION_BUS_ADDRESS"] = bus' \
            'import secretstorage' \
            'conn = secretstorage.dbus_init()' \
            'collection = secretstorage.get_default_collection(conn)' \
            'if collection.is_locked():' \
            '    collection.unlock()' \
            'time.sleep(0.5)' \
            'collection = secretstorage.get_default_collection(conn)' \
            'if collection.is_locked():' \
            '    sys.exit("the default collection stayed locked — the keyring cannot serve W130")' \
            'collection.create_item("ci-unlock-probe", {"service": "workflow", "credential": "ci-unlock-probe"}, b"ci-probe")' \
            'print("probe item created")' > /tmp/keyring-create.py
          printf '%s\n' \
            'import os, subprocess, secretstorage' \
            'bus = subprocess.check_output(["bash", "-c", "echo $DBUS_SESSION_BUS_ADDRESS"]).decode().strip()' \
            'os.environ["DBUS_SESSION_BUS_ADDRESS"] = bus' \
            'conn = secretstorage.dbus_init()' \
            'collection = secretstorage.get_default_collection(conn)' \
            'item = next((i for i in collection.get_all_items() if i.get_label() == "ci-unlock-probe"), None)' \
            'assert item is not None, "the probe item vanished"' \
            'assert item.get_secret().decode() == "ci-probe", "the probe secret round-trip mismatched"' \
            'print("keyring probe: created + read back ok")' > /tmp/keyring-verify.py
          python3 /tmp/keyring-create.py
          python3 /tmp/keyring-verify.py
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "GNOME_KEYRING_CONTROL=/run/user/$(id -u)/keyring" >> "$GITHUB_ENV" || true
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
