# Publish workflow (W149, 2026-09-26): tagged release -> GHCR image +
# recorded digest expectation. Honest status: NOT yet verified live — the
# first tagged run is the verification. Fail-closed posture throughout.
#
# Prerequisite the workflow refuses to skip: the tagged release must carry
# the qualified stock-opencode binary as an asset (operator attaches it once
# per pinned version — v2.0.10 is a dev-channel build not publicly
# fetchable; see infra/c0/image/Dockerfile and images/control-plane/Dockerfile).
# The digest the instance later verifies (spec Q2 / verify-pin.sh) is
# recorded at the SAME tag, from the SAME run that pushed the image. The
# record is EXACTLY ONE `sha256:<64hex>` line: build-push-action's `digest`
# output already carries the `sha256:` prefix, and the record step asserts
# that exact format before writing (the pre-2026-09-30 code double-prefixed
# it as `sha256:sha256:<64hex>` via `printf 'sha256:%s'`).
#
# Shell-safety note (the review's P2): git refnames may legally contain
# shell metacharacters, so every run: step consumes the tag through an env
# var — never by direct ${{ }} interpolation into the script text. The
# repository name is alphanumeric-plus-dash/dot (GitHub-enforced), and
# action-input interpolations (with:) are not shell.
#
# Manual runs (W149 review P3 fix): `workflow_dispatch` takes a required `tag`
# input and the FIRST step resolves one RELEASE_TAG (the input when given, else
# the pushed ref), failing closed on a non-`v` value and exporting it through
# GITHUB_ENV. A dispatch from `main` therefore targets the release tag rather
# than the branch.

name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* release tag to publish (the release must already carry the qualified opencode asset)"
        required: true
        type: string

permissions:
  contents: write # release asset + notes upload
  packages: write # GHCR push

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A manual run starts from a branch, so `github.ref_name` is `main`, not
      # the release tag. Resolve ONE tag for every release step: the dispatch
      # input when given (a manual run), else the pushed tag ref. Fail closed on
      # a non-`v` value so a typo cannot target a branch. The tag is exported
      # through GITHUB_ENV and consumed only through env vars (shell-safety).
      - name: Resolve the release tag (dispatch input or pushed tag, fail closed)
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          PUSHED_REF: ${{ github.ref_name }}
        run: |
          resolved="$RELEASE_TAG_INPUT"
          if [ -z "$resolved" ]; then
            resolved="$PUSHED_REF"
          fi
          # A strict bash regex, not an anchored `grep`: grep is line-based, so
          # a newline-bearing value (`v2.0.10\nINJECTED=...`) would match on its
          # first line and inject extra GITHUB_ENV entries. `[[ =~ ]]` matches
          # the whole value, so the newline is rejected.
          if [[ ! "$resolved" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::the release tag must match ^v[0-9][A-Za-z0-9._-]*\$ (got: ${resolved})" >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\n' "$resolved" >> "$GITHUB_ENV"

      # GHCR requires lowercase image names; GITHUB_REPOSITORY may contain
      # uppercase (ultus-net/Workflow would break the push).
      - name: Normalize the image reference (lowercase repository for GHCR)
        run: |
          printf 'IMAGE_REPOSITORY=%s\n' "$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download the qualified opencode release asset (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "opencode" \
            --dir images/control-plane
          if [ ! -f images/control-plane/opencode ]; then
            echo "::error::the tagged release must carry the qualified opencode binary as an asset (attach it to the release; it is not publicly fetchable)" >&2
            exit 1
          fi

      - name: Verify the vendored binary against the recorded pin
        working-directory: images/control-plane
        run: sha256sum -c opencode.sha256

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        name: Build and push the control-plane image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/control-plane/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}

      - name: Record the digest at the tagged release (the verify-pin contract)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # build-push-action's `digest` output is ALREADY `sha256:<64hex>`;
          # the original `printf 'sha256:%s'` produced the malformed
          # `sha256:sha256:<64hex>`. Assert the exact contract format before
          # recording so a malformed value fails closed (an error, never a
          # written expectation the instance would later mismatch on).
          if ! printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action returned a non-contract digest (want sha256:<64-hex>): ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
          gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > body.md 2>/dev/null || : > body.md
          printf '\ncontrol-plane image digest:\n' >> body.md
          cat image-digest.txt >> body.md
          gh release upload "$RELEASE_TAG" image-digest.txt --clobber --repo "${GITHUB_REPOSITORY}"
          gh release edit "$RELEASE_TAG" --notes-file body.md --repo "${GITHUB_REPOSITORY}"
