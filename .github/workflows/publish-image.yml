# Publish workflow (W149, 2026-09-26): tagged release -> GHCR image +
# recorded digest expectation. Honest status: NOT yet verified live — the
# first tagged run is the verification. Fail-closed posture throughout.
#
# Prerequisite the workflow refuses to skip: the tagged release must carry
# the qualified stock-opencode binary as an asset (operator attaches it once
# per pinned version — v2.0.10 is a dev-channel build not publicly
# fetchable; see infra/c0/image/Dockerfile and images/control-plane/Dockerfile).
# The digest the instance later verifies (spec Q2 / verify-pin.sh) is
# recorded at the SAME tag, from the SAME run that pushed the image.

name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # release asset + notes upload
  packages: write # GHCR push

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the qualified opencode release asset (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "opencode" \
            --dir images/control-plane
          if [ ! -f images/control-plane/opencode ]; then
            echo "::error::the tagged release must carry the qualified opencode binary as an asset (attach it to the release; it is not publicly fetchable)" >&2
            exit 1
          fi

      - name: Verify the vendored binary against the recorded pin
        working-directory: images/control-plane
        run: sha256sum -c opencode.sha256

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        name: Build and push the control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/control-plane/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Record the digest at the tagged release (the verify-pin contract)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'sha256:%s\n' "${{ steps.push.outputs.digest }}" > image-digest.txt
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json body --jq .body > body.md 2>/dev/null || : > body.md
          printf '\ncontrol-plane image digest:\n' >> body.md
          cat image-digest.txt >> body.md
          gh release upload "${{ github.ref_name }}" image-digest.txt --clobber --repo "${{ github.repository }}"
          gh release edit "${{ github.ref_name }}" --notes-file body.md --repo "${{ github.repository }}"