name: Scheduled dependency refresh
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.5.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm update
      - run: pnpm --dir mcp-toolbox install --frozen-lockfile
      - run: pnpm --dir mcp-toolbox run verify
      - run: npm test
      - run: node scripts/bump-cline-tag.mjs
        continue-on-error: true
      - name: Report
        run: |
          git diff --stat
          git status --short
