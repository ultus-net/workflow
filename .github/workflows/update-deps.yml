name: Scheduled dependency refresh
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.5.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm update
      - run: pnpm --dir mcp-toolbox install --frozen-lockfile
      - run: pnpm --dir mcp-toolbox run verify
      - run: npm test
      - run: node scripts/bump-cline-tag.mjs
        continue-on-error: true
      - name: Report
        run: |
          git diff --stat
          git status --short
